[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stdapi"
version = "2.1.0"
description = "Industrial media engine, autonomous agentic OS engine, FFmpeg pipeline, and MCP server."
readme = "README.md"

requires-python = ">=3.9"
license = { text = "Apache-2.0" }

authors = [
  { name = "STD-DEEPANSHU", email = "support@deepanshu.in" }
]

keywords = [
  "engine",
  "media",
  "downloader",
  "ffmpeg",
  "mcp",
  "stealth",
  "telegram-bot",
  "cli"
]

dependencies = [
  "aiohttp>=3.9.0",
  "requests>=2.31.0",
  "yt-dlp>=2024.03.10",
  "rich>=13.7.0"
]

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
  "Topic :: Software Development :: Libraries"
]

[project.scripts]
stdapi = "stdapi.ui.cli:main"

[project.urls]
Homepage = "https://github.com/STD-DEEPANSHU/StdAPI"
Documentation = "https://github.com/STD-DEEPANSHU/StdAPI#readme"
Tracker = "https://github.com/STD-DEEPANSHU/StdAPI/issues"
