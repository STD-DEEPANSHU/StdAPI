[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stdapi"
version = "0.0.1"
description = "Python SDK for StdAPI - media downloader and API client"
readme = "README.md"
requires-python = ">=3.9"

license = { text = "Apache-2.0" }

authors = [
  { name = "STD-DEEPANSHU", email = "support@deepanshu.in" }
]

keywords = [
  "api",
  "sdk",
  "downloader",
  "media",
  "python"
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Typing :: Typed"
]

dependencies = [
  "requests>=2.28.0"
]

[project.optional-dependencies]
dev = [
  "pytest",
  "black",
  "ruff",
  "mypy"
]

[project.urls]
Homepage = "https://github.com/STD-DEEPANSHU/StdAPI"
Repository = "https://github.com/STD-DEEPANSHU/StdAPI"
Issues = "https://github.com/STD-DEEPANSHU/StdAPI/issues"

[tool.setuptools]
packages = { find = { exclude = ["tests*"] } }

[tool.setuptools.package-data]
stdapi = ["py.typed"]

[tool.mypy]
strict = true
